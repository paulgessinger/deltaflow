[project]
name = "deltaflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Gessinger", email = "hello@paulgessinger.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "sqlalchemy>=2.0.54",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
deltaflow = "deltaflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deltaflow"]

# Migrations are data files inside the package; without this they are absent
# from an installed wheel and `deltaflow migrate` fails with a bare "no such
# script location".
artifacts = ["src/deltaflow/migrations/**"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
